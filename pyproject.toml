[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lsdyna-manual-to-markdown"
version = "0.1.0-dev"
description = "Convert user-supplied LS-DYNA manuals into structured Markdown documents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "LS-DYNA Manual to Markdown contributors" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pypdf>=4.0.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/945144024/lsdyna-manual-to-markdown"
Repository = "https://github.com/945144024/lsdyna-manual-to-markdown"
Issues = "https://github.com/945144024/lsdyna-manual-to-markdown/issues"
Documentation = "https://github.com/945144024/lsdyna-manual-to-markdown/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
manual-to-markdown = "lsdyna_manual.cli.main:main"
manual-to-markdown-regression = "lsdyna_manual.regression:main"
manual-to-markdown-sample = "lsdyna_manual.regression_sampling:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
