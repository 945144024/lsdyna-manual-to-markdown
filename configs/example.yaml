# Copy this file to configs/local.yaml before adding credentials.
# Relative paths are resolved against the current working directory.

manual:
  # One run processes one release. R12-R17 are verified.
  release: "R17"

  # Auto-discover any non-empty Keyword/Theory subset for the selected release.
  manuals_dir: "./manuals"

  # Optional explicit list for non-standard filenames. When enabled, this
  # replaces auto-discovery. Official filenames can infer type and volume.
  # documents:
  #   - path: "manuals/LS-DYNA_Manual_Vol_I_R17.pdf"
  #   - path: "manuals/LS-DYNA_Manual_Theory_R17.pdf"
  #   - path: "manuals/custom-keyword.pdf"
  #     manual_type: "keyword"
  #     volume: 2

parser:
  # Select either the remote Baidu API or the local PaddleOCR + llama.cpp stack.
  provider: "paddleocr-vl-remote"
  model: "PaddleOCR-VL-1.6"
  job_url: "https://paddleocr.aistudio-app.com/api/v2/ocr/jobs"

  # Get a key from https://aistudio.baidu.com/paddleocr and set it only in an
  # ignored local config. inspect and the current ingest-only build may use null.
  api_key: null

  timeout_seconds: 1800
  poll_interval_seconds: 5
  max_retries: 2
  # Both providers default to one page per request for deterministic page
  # mapping. Remote users may explicitly increase this after validation.
  max_batch_pages: 1

  # Optional fallback for Paddle business codes that contain no quota text.
  # Quota errors are always recorded in parsing/state.json without the API key.
  quota_exhausted_codes: []

  # Local provider settings. The local provider always enforces
  # max_batch_pages: 1. Keep this block commented when using the remote provider.
  # local:
  #   runtime_dir: "./.runtime/paddleocr-local"
  #   llama_server_path: "/mnt/c/Users/<user>/.cache/lsdyna-manual-builder/llama-server.exe"
  #   # Instead of an existing path, configure one explicit binary source.
  #   # llama_server_download_url: "https://example.invalid/llama-server"
  #   # llama_server_archive_url: "https://example.invalid/llama-server.zip"
  #   # llama_cuda_archive_url: "https://example.invalid/cuda-runtime.zip"
  #   llama_server_url: "http://127.0.0.1:8111/v1"
  #   llama_server_host: "127.0.0.1"
  #   llama_server_port: 8111
  #   model_source: "bos"  # PaddleX auxiliary layout-model hoster
  #   paddlex_cache_dir: "./.runtime/paddleocr-local/paddlex"
  #   model_path: "/mnt/c/Users/<user>/.cache/lsdyna-manual-builder/PaddleOCR-VL-1.6-GGUF.gguf"
  #   mmproj_path: "/mnt/c/Users/<user>/.cache/lsdyna-manual-builder/PaddleOCR-VL-1.6-GGUF-mmproj.gguf"
  #   auto_prepare_runtime: false
  #   auto_start_server: true
  #   max_concurrency: 1
  #   paddleocr_python: "./.runtime/paddleocr-local/venv/bin/python"

output:
  corpus_dir: "./workspace/run_r17"

options:
  start_page: 1
  end_page: null
  concurrency: 4

validation:
  # Compare a deterministic sample of PageIR pages against pdftotext output.
  text_layer_enabled: true
  text_layer_sample_pages: 3
  text_layer_min_tokens: 8
  text_layer_min_visual_recall: 0.65
