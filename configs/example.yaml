# Copy this file to configs/local.yaml before adding credentials.
# Relative paths are resolved against the current working directory.

manual:
  # One run processes one release. R12-R17 are verified.
  release: "R17"

  # Auto-discover any non-empty Keyword/Theory subset for the selected release.
  manuals_dir: "./manuals"

  # Optional explicit list for non-standard filenames. When enabled, this
  # replaces auto-discovery. Official filenames can infer type and volume.
  # documents:
  #   - path: "manuals/LS-DYNA_Manual_Vol_I_R17.pdf"
  #   - path: "manuals/LS-DYNA_Manual_Theory_R17.pdf"
  #   - path: "manuals/custom-keyword.pdf"
  #     manual_type: "keyword"
  #     volume: 2

parser:
  # The supported remote parser is the Baidu AI Studio PaddleOCR API.
  provider: "paddleocr-vl-remote"
  model: "PaddleOCR-VL-1.6"
  job_url: "https://paddleocr.aistudio-app.com/api/v2/ocr/jobs"

  # Get a key from https://aistudio.baidu.com/paddleocr and set it only in an
  # ignored local config. inspect and the current ingest-only build may use null.
  api_key: null

  timeout_seconds: 1800
  poll_interval_seconds: 5
  max_retries: 2
  batch_size: 5

output:
  corpus_dir: "./workspace/run_r17"

options:
  start_page: 1
  end_page: null
  concurrency: 4
